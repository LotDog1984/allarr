# For developing: build the image from this checkout instead of pulling it.
#   docker compose -f docker-compose.build.yml up -d --build
services:
  allarr:
    build: .
    image: allarr:dev
    container_name: allarr
    restart: unless-stopped
    ports: ["8080:8080", "5055:5055", "5690:5690", "6881:6881", "6881:6881/udp"]
    environment: { PUID: "1000", PGID: "1000", TZ: "Etc/UTC" }
    volumes:
      - ./config:/config
      - ./media:/media
